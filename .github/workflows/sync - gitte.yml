name: 仅同步 master 到 Gitee
on:
  workflow_run:
    workflows: ["全自动整体同步"]
    types:
      - completed
  workflow_dispatch:

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 master 分支代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 配置 Git 用户
        run: |
          git config --global user.name "t717796163"
          git config --global user.email "t717796163@users.noreply.github.com"

      - name: 添加 Gitee 远程仓库
        run: |
          git remote add gitee https://t717796163:${{ secrets.GITEE_TOKEN }}@gitee.com/t717796163/AzurPilot.git || true

      - name: 强制推送 master 分支到 Gitee
        run: |
          git push -f gitee master:master
