name: 仅同步 master 到 Gitee
on:
  workflow_run:
    workflows: ["全自动整体同步"]
    types:
      - completed
  workflow_dispatch:

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 master 分支代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 仅同步 master 到 Gitee
        uses: Yikun/action-mirror@master
        with:
          src: 'https://github.com/t717796163/AzurPilot.git'
          dst: 'https://t717796163:${{ secrets.GITEE_TOKEN }}@gitee.com/t717796163/AzurPilot.git'
          static_list: 'master'
          force_update: true
