name: 全自动整体同步
on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write    # GITHUB_TOKEN 用于检出代码，PAT 用于推送

jobs:
  full_sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取完整仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Git用户
        run: |
          git config --global user.name "Sync Bot"
          git config --global user.email "sync@bot.com"

      # 🔑 关键步骤：用 PAT 替换默认认证
      - name: 切换为 PAT 认证
        run: |
          git remote set-url origin "https://${{ secrets.SYNC_PAT }}@github.com/t717796163/AzurPilot.git"

      - name: 同步上游最新到master
        run: |
          git remote add upstream https://github.com/wess09/AzurPilot.git || git remote set-url upstream https://github.com/wess09/AzurPilot.git
          git fetch upstream
          git checkout -B master upstream/master
          git push -f origin master

      - name: 合并最新master到my-mod
        run: |
          git checkout my-mod
          git merge origin/master --no-edit || true
          git push origin my-mod
