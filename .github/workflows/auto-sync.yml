name: 全自动整体同步
on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

jobs:
  full_sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取完整仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }} # 这里使用你配置的Token

      - name: 配置Git用户
        run: |
          git config --global user.name "Sync Bot"
          git config --global user.email "sync@bot.com"

      - name: 同步上游最新到master
        run: |
          git remote add upstream https://github.com/wess09/AzurPilot.git || git remote set-url upstream https://github.com/wess09/AzurPilot.git
          git fetch upstream
          git checkout -B master upstream/master
          git push -f origin master

      - name: 合并最新master到my-mod
        run: |
          git checkout my-mod
          git merge origin/master --no-edit || true
          git push origin my-mod
