name: Sync GitHub master → Gitee master
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.GITEE_SSH_KEY }}
          known_hosts: gitee.com

      - name: Push to Gitee
        run: |
          git remote add gitee git@gitee.com:t717796163/AzurPilot.git
          git push -f gitee master:master
