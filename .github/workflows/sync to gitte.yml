name: Sync to Gitee (SSH 稳定版)
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 安装 SSH 并配置 Gitee 私钥
      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.GITEE_SSH_KEY }}
          known_hosts: gitee.com

      # 直接推送到 Gitee（不重新拉代码！）
      - name: Push to Gitee
        run: |
          git remote add gitee git@gitee.com:t717796163/Azurpilot.git
          git push --force gitee HEAD:master
