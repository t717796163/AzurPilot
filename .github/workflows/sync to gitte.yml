name: Sync GitHub master to Gitee master
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Push to Gitee master
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee https://${TOKEN}@gitee.com/t717796163/AzurPilot.git
          git push -f gitee master:master
