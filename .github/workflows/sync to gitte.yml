name: Sync GitHub to Gitee
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee 国内高速地址
        run: |
          git push --force https://${{ secrets.GITEE_TOKEN }}@gitee.com/t717796163/Azurpilot.git HEAD:master
